<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" width="1200" height="430" role="img" aria-label="3D floating GitHub activity dashboard">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#070707"/><stop offset="1" stop-color="#160606"/></linearGradient>
 <linearGradient id="edge"><stop stop-color="#ff3b30"/><stop offset="1" stop-color="#7f1d1d"/></linearGradient>
 <filter id="shadow"><feGaussianBlur stdDeviation="12"/></filter>
 <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect x="10" y="10" width="1180" height="410" rx="30" fill="url(#bg)" stroke="#2b0a0a"/>
