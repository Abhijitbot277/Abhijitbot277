<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" width="1200" height="430" role="img" aria-label="Purple liquid motion graphic for GitHub activity">
<defs>
 <radialGradient id="bg"><stop stop-color="#180a2b"/><stop offset=".65" stop-color="#08040f"/><stop offset="1" stop-color="#030207"/></radialGradient>
 <linearGradient id="liq" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e9d5ff"/><stop offset=".18" stop-color="#c084fc"/><stop offset=".5" stop-color="#a855f7"/><stop offset=".82" stop-color="#7c3aed"/><stop offset="1" stop-color="#4c1d95"/></linearGradient>
 <linearGradient id="shine" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff" stop-opacity=".9"/><stop offset=".35" stop-color="#fff" stop-opacity=".05"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="18" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="blur"><feGaussianBlur stdDeviation="7"/></filter>
 <style>
  .orb{transform-box:fill-box;transform-origin:center;animation:orb 7s ease-in-out infinite}
  .orb2{transform-box:fill-box;transform-origin:center;animation:orb2 9s ease-in-out infinite}
  .drop{animation:drop 4s cubic-bezier(.55,.05,.45,.95) infinite}
  .drop2{animation:drop2 5.5s cubic-bezier(.55,.05,.45,.95) infinite 1.2s}
  .drop3{animation:drop3 6s cubic-bezier(.55,.05,.45,.95) infinite 2.4s}
  .pulse{animation:pulse 2.8s ease-in-out infinite}
  @keyframes orb{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(12px,-12px) scale(1.04)}}
  @keyframes orb2{0%,100%{transform:translate(0,0) rotate(0)}50%{transform:translate(-15px,10px) rotate(5deg)}}
  @keyframes drop{0%{transform:translateY(-90px) scale(.7);opacity:0}18%{opacity:1}62%{transform:translateY(105px) scale(1);opacity:1}78%{transform:translateY(125px) scale(1.7,.35);opacity:.8}100%{transform:translateY(125px) scale(2.2,.15);opacity:0}}
  @keyframes drop2{0%{transform:translateY(-110px) scale(.6);opacity:0}18%{opacity:1}65%{transform:translateY(100px) scale(1);opacity:1}82%{transform:translateY(120px) scale(1.8,.3);opacity:.75}100%{transform:translateY(120px) scale(2.2,.1);opacity:0}}
  @keyframes drop3{0%{transform:translateY(-130px) scale(.55);opacity:0}20%{opacity:1}66%{transform:translateY(105px) scale(1);opacity:1}84%{transform:translateY(120px) scale(1.7,.3);opacity:.7}100%{transform:translateY(120px) scale(2,.1);opacity:0}}
  @keyframes pulse{0%,100%{opacity:.25}50%{opacity:.7}}
 </style>
</defs>
<rect width="1200" height="430" rx="30" fill="url(#bg)"/>
<g class="pulse" filter="url(#blur)" fill="#a855f7"><ellipse cx="600" cy="250" rx="350" ry="105"/></g>

<!-- floating glass/liquid forms -->
<g class="orb">
 <path d="M385 105C420 72 480 70 518 99C548 122 555 163 535 193C514 224 470 238 428 225C386 212 358 176 363 140C366 126 374 115 385 105Z" fill="url(#liq)" filter="url(#glow)"/>
 <ellipse cx="432" cy="119" rx="45" ry="18" fill="url(#shine)" opacity=".55" transform="rotate(-20 432 119)"/>
</g>
<g class="orb2">
 <path d="M670 95C711 68 770 80 794 117C817 153 806 199 770 220C735 241 685 226 662 190C641 157 643 113 670 95Z" fill="url(#liq)" filter="url(#glow)"/>
 <ellipse cx="718" cy="105" rx="42" ry="16" fill="url(#shine)" opacity=".5" transform="rotate(22 718 105)"/>
</g>

<!-- central liquid pool -->
<path d="M300 285C326 238 381 220 440 231C494 241 516 266 553 258C596 248 614 210 672 215C729 219 752 260 800 269C851 279 896 256 920 290C950 333 908 374 852 380H375C316 379 276 330 300 285Z" fill="url(#liq)" filter="url(#glow)"/>
<ellipse cx="608" cy="350" rx="260" ry="26" fill="#c084fc" opacity=".18" filter="url(#blur)"/>
<path d="M380 286C455 263 500 293 552 281C615 266 650 244 716 267C773 287 811 296 866 281" fill="none" stroke="#eadcff" stroke-opacity=".5" stroke-width="3"/>

<!-- falling droplets -->
<g class="drop" transform="translate(470 0)">
 <path d="M0 0C-11 19-24 33-24 48C-24 64-13 74 0 74S24 64 24 48C24 33 11 19 0 0Z" fill="url(#liq)" filter="url(#glow)"/>
</g>
<g class="drop2" transform="translate(620 0)">
 <path d="M0 0C-9 16-20 29-20 42C-20 56-11 65 0 65S20 56 20 42C20 29 9 16 0 0Z" fill="url(#liq)" filter="url(#glow)"/>
</g>
<g class="drop3" transform="translate(770 0)">
 <path d="M0 0C-10 17-21 30-21 44C-21 58-12 68 0 68S21 58 21 44C21 30 10 17 0 0Z" fill="url(#liq)" filter="url(#glow)"/>
</g>

<!-- tiny particles -->
<g fill="#d8b4fe" filter="url(#glow)">
 <circle cx="275" cy="125" r="3"/><circle cx="320" cy="215" r="2"/><circle cx="870" cy="120" r="3"/><circle cx="930" cy="205" r="2"/><circle cx="1020" cy="275" r="3"/>
</g>

<g font-family="Arial,sans-serif" text-anchor="middle">
 <text x="600" y="54" fill="#fff" font-size="25" font-weight="800" letter-spacing="5">GITHUB ACTIVITY</text>
 <text x="600" y="78" fill="#c084fc" font-size="10" letter-spacing="4">DROP • FLOW • BUILD</text>
</g>
<text x="600" y="405" text-anchor="middle" fill="#9f8bb7" font-family="Arial,sans-serif" font-size="10" letter-spacing="3">CONTRIBUTIONS IN MOTION</text>
</svg>